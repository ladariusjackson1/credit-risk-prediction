[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=credit_risk --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["credit_risk"]
omit = ["*/credit_risk/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["credit_risk", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/credit_risk/plots.py" = ["E402"]
"app/streamlit_app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
